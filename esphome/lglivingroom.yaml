# Andrew's living-room LG (B70AWYN9L6, PREMTA000 wall remote) on the thermostat-rig branch.
# Same board and pins as the February build; adds the two bus test selects.

substitutions:
  deviceid: "lglivingroom"
  devicename: "Air conditioner LG"
  # Room temperature the controller puts on the bus (status byte 7).
  # sensor.lgcurrenttemperature is the raw Zigbee mean, which is what the Judoka was fed, so the
  # first test compares like with like. sensor.ac_derived_temp_thermostat is the exaggerated
  # version from the ESPHome days; swap it in once the bits are attributed.
  temperature_sensor_entity_id: sensor.lgcurrenttemperature
  fahrenheit: "false"
  is_slave_controller: "false"

api:
  encryption:
    key: !secret lglivingroom_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.50.232
    gateway: 192.168.50.1
    subnet: 255.255.255.0
  ap:
    ssid: "${deviceid} Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

ota:
  platform: esphome
  password: !secret lglivingroom_ota_password

# DEBUG shows every frame sent ("sending A8 ...") and received without the VERBOSE byte spam.
logger:
  level: DEBUG

esphome:
  name: ${deviceid}
  friendly_name: ${devicename}

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

uart:
  - id: ac_serial
    tx_pin: GPIO25
    rx_pin:
      number: GPIO26
      allow_other_uses: true
    baud_rate: 104

sensor:
  - id: temp_sensor
    platform: homeassistant
    internal: true
    entity_id: ${temperature_sensor_entity_id}
  - platform: uptime
    name: Uptime

external_components:
  source: github://andi-christ/esphome-lg-controller@thermostat-rig
  components: [lg_controller]
  refresh: 0s

climate:
  - platform: lg_controller
    name: ""
    id: ${deviceid}
    uart_id: ac_serial
    rx_pin:
      number: GPIO26
      allow_other_uses: true
    fahrenheit: ${fahrenheit}
    is_slave_controller: ${is_slave_controller}
    temperature_sensor: temp_sensor
    # Bus test controls. Both default to "Mirror unit", which is the stock behaviour.
    byte3_mode:
      name: "Test: byte 3 bit 3"
      id: byte3_mode
      icon: mdi:flask-outline
    byte5_running_flag:
      name: "Test: byte 5 running flag"
      id: byte5_running_flag
      icon: mdi:flask-outline
    vane1:
      name: Airflow 1 Up-Down
      id: vane_position_1
      icon: mdi:arrow-up-down
    vane2:
      name: Airflow 2 Up-Down
      id: vane_position_2
      icon: mdi:arrow-up-down
    vane3:
      name: Airflow 3 Up-Down
      id: vane_position_3
      icon: mdi:arrow-up-down
    vane4:
      name: Airflow 4 Up-Down
      id: vane_position_4
      icon: mdi:arrow-up-down
    overheating:
      name: Over Heating
      id: overheating
      icon: mdi:heating-coil
    fan_speed_slow:
      name: Fan Speed Slow
      id: fan_speed_slow
      icon: mdi:fan-chevron-down
      mode: box
    fan_speed_low:
      name: Fan Speed Low
      id: fan_speed_low
      icon: mdi:fan-speed-1
      mode: box
    fan_speed_medium:
      name: Fan Speed Medium
      id: fan_speed_medium
      icon: mdi:fan-speed-2
      mode: box
    fan_speed_high:
      name: Fan Speed High
      id: fan_speed_high
      icon: mdi:fan-speed-3
      mode: box
    sleep_timer:
      name: "Sleep Timer (minutes)"
      id: sleep_timer
      icon: mdi:timer-outline
      mode: box
    error_code:
      name: Error Code
      id: error_code
      icon: mdi:alert-circle-outline
    pipe_temp_in:
      name: Pipe Temperature In
      id: pipe_temperature_in
      icon: mdi:thermometer
      unit_of_measurement: "°C"
    pipe_temp_mid:
      name: Pipe Temperature Mid
      id: pipe_temperature_mid
      icon: mdi:thermometer
      unit_of_measurement: "°C"
    pipe_temp_out:
      name: Pipe Temperature Out
      id: pipe_temperature_out
      icon: mdi:thermometer
      unit_of_measurement: "°C"
    defrost:
      name: Defrost
      id: defrost
      icon: mdi:snowflake-melt
    preheat:
      name: Preheat
      id: preheat
      icon: mdi:heat-wave
    outdoor:
      name: Outdoor Unit
      id: outdoor
      icon: mdi:fan
    auto_dry_active:
      name: Auto Dry Active
      id: auto_dry_active
      icon: mdi:fan-clock
    purifier:
      name: Air Purifier
      id: air_purifier
      icon: mdi:pine-tree
    internal_thermistor:
      name: Internal Thermistor
      id: internal_thermistor
      icon: mdi:thermometer
    auto_dry:
      name: Auto Dry
      id: auto_dry
      icon: mdi:fan-clock
